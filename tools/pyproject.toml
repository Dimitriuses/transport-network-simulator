[project]
name = "tns-tools"
version = "0.0.0"
description = "Offline pipeline: OSM extraction, world building, validation, scoring analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# Added as the milestones that need them arrive. Kept empty at M0 so the
# skeleton installs instantly and CI stays fast.
#   worldbuild : pyrosm / osmnx / shapely   (M1+)
#   analysis   : pandas / numpy             (M5+)

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldbuild", "validate", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
