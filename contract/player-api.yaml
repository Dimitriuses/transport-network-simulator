info:
  title: Player API
  version: "0.3"
  summary: Endpoints the simulator calls on the player's service.
  description: |-
    The player's surface is small, fixed, and — unlike the operator APIs — documented exactly and honestly. That contrast is pedagogical and should be preserved. See PLAYER-CONTRACT.md §5.

    **Specified and not yet honoured** (KNOWN-ISSUES.md #72):

    * The run token: `Authorization: Bearer <run token>` between simulator, player and control API, and `TNS_TOKEN`. Nothing is authenticated. (PLAYER-CONTRACT.md §3)
    * `X-TNS-Contract` on every request, and an abort before the run on a version mismatch. (PLAYER-CONTRACT.md §3)
    * Capabilities gate plans and replans. Only `tick` is gated: a player that does not claim `plan` is still sent plans. (PLAYER-CONTRACT.md §5.2)
    * `preferences` on a plan request. (PLAYER-CONTRACT.md §5.4)
    * `next_interval_sim_s` in a tick response: the cadence declared in `/v1/identity` is used for the whole run. (PLAYER-CONTRACT.md §5.6)
    * The brief's digest on `run-start`, and any `run-end` reason other than `completed`. (PLAYER-CONTRACT.md §5.7)
    * `wall_budget_s`, `pause_queue_depth` and `preparation.wall_budget_s` in the brief, and per-operator auth schemes other than `none`. (PLAYER-CONTRACT.md §6.1)
    * `itinerary` on a notification: it is accepted and ignored. (PLAYER-CONTRACT.md §6.3)
    * Manual pause: `state` never becomes `paused`, and nothing queues. (PLAYER-CONTRACT.md §6.4)
  license:
    name: MIT
    identifier: MIT
servers:
  - url: "{player_base_url}/v1"
    variables:
      player_base_url:
        default: http://localhost:8080
paths:
  /identity:
    get:
      operationId: getIdentity
      summary: Who the player is and what it implements
      description: Read once before the run. Unclaimed capabilities are scored as forgone rather than failed, so a partial solution is a valid participant.
      responses:
        "200":
          description: Player identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        4XX:
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /health:
    get:
      operationId: getHealth
      summary: Readiness
      description: Polled only before the run, with a bounded budget from the brief.
      responses:
        "200":
          description: Player readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        5XX:
          description: Player not ready
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /plan:
    post:
      operationId: plan
      summary: Plan journeys for travellers about to set out
      description: Issued half an hour before a traveller departs. An answer takes effect at `deadline`, in simulated time, however fast it arrived. A response that does not match this schema is recorded as `player_error`, and the traveller falls back to the reference policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: One result per request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
  /replan:
    post:
      operationId: replan
      summary: A plan broke in front of a traveller
      description: "Carries what the traveller perceived and where they stand, in the operator's own identifiers, and the part of the plan not yet travelled. Not the destination: you were told it when you planned."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplanRequest"
      responses:
        "200":
          description: One result per request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplanResponse"
  /tick:
    post:
      operationId: tick
      summary: Fetch from the operators now
      description: Sent at the cadence you declare in `/v1/identity`, and only if you claim `tick`. At an instant holding both a tick and an obligation, the tick comes first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TickRequest"
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickResponse"
  /run-start:
    post:
      operationId: runStart
      summary: The run has started
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStartNotice"
      responses:
        2XX:
          description: Ignored
  /run-end:
    post:
      operationId: runEnd
      summary: The run has ended
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunEndNotice"
      responses:
        2XX:
          description: Ignored
