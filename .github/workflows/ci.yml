name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: TypeScript runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >= 22.18 runs .ts directly by stripping types. See tsconfig.base.json.
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        # Includes the four determinism rules on src/core and src/router.
        # See CLAUDE.md and eslint.config.mjs.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contract documents match their schema source
        # contract/*.yaml is generated from src/schema and committed, so it is
        # always browsable. This asserts it is also always true. ROADMAP.md M0.
        run: npm run contract:check

      - name: Test
        run: npm test

  skeleton:
    name: Walking skeleton runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      # A rebuild must reproduce the committed world's *content*. Not its
      # bytes: SQLite stamps its own version number into the database header,
      # so a runner on a different Python build produces a byte-different file
      # from an identical world. Comparing content is both the correct
      # invariant and the one that actually matters — a world that does not
      # rebuild identically makes runs incomparable across machines.
      - name: World bundle rebuilds identically
        run: cd tools && uv sync && uv run python -m worldbuild --verify

      # ROADMAP.md M1: builds the world, runs the simulation, calls a player
      # (as a separate process, over HTTP) and prints a score — twice, with
      # identical output.
      - name: Demo produces identical output twice
        run: |
          set -e
          npm run demo > /tmp/run1.txt
          npm run demo > /tmp/run2.txt
          diff /tmp/run1.txt /tmp/run2.txt
          cat /tmp/run1.txt

      - name: Defect audit
        # DATA-MODEL.md §7 gate 4: every conflict a world declares must
        # actually be present in what its operators publish.
        run: npm run audit

      - name: Three-gap calibration
        run: npm run calibrate

      # M4 exit condition: a player that never polls scores 0 on Information;
      # one that polls sensibly scores meaningfully higher.
      - name: A player that never looks learns nothing
        run: |
          set -e
          TNS_PLAYER_MODE=blind npm run demo > /tmp/blind.txt
          npm run demo > /tmp/honest.txt
          grep -q "score   0.000" /tmp/blind.txt
          ! grep -q "score   0.000" /tmp/honest.txt

      # M5 exit condition. An audit that has never fired on a real violation is
      # an assertion, not a check — so CI plants one every build.
      - name: The information-set audit catches a planted leak
        run: |
          set -e
          TNS_PLAYER_MODE=cheat npm run demo > /tmp/cheat.txt
          grep -q "INFORMATION-SET AUDIT   clean" /tmp/honest.txt
          grep -q "LEAK(S)" /tmp/cheat.txt

      # Phase 0's verdict, recomputed every build. If a change to the engine,
      # the world or the scorer moves a gate, that is worth knowing at once
      # rather than the next time somebody remembers to look.
      - name: Phase 0 proof gates
        run: |
          set -e
          npm run gates | tee /tmp/gates.txt
          grep -q "VERDICT: all three gates pass" /tmp/gates.txt

  offline:
    name: Python offline pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  determinism:
    name: Determinism rules are enforced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The rules in eslint.config.mjs are load-bearing: without them the
      # project's reproducibility guarantee disappears quietly, and would
      # surface much later as unexplainable score differences. This asserts a
      # real violation in src/core is rejected, independently of the fixture
      # test — so the check survives someone deleting the fixture.
      - name: A real Math.random() in src/core must fail lint
        run: |
          set -e
          cp src/core/src/index.ts /tmp/index.bak
          printf '\nexport const oops = () => Math.random();\n' >> src/core/src/index.ts
          if npx eslint src/core; then
            cp /tmp/index.bak src/core/src/index.ts
            echo "::error::A deliberate Math.random() in src/core passed lint. The determinism rules are not being enforced."
            exit 1
          fi
          cp /tmp/index.bak src/core/src/index.ts
          echo "Determinism rules are enforced."
